<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a56db"/>
<link rel="manifest" href="manifest.json"/>
<title>Order Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;}
.wrap{padding:16px;max-width:560px;margin:auto;padding-bottom:40px;}
.header{background:#1a56db;color:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px;}
.header h2{font-size:18px;font-weight:700;}
.header p{font-size:12px;opacity:.8;margin-top:3px;}
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;margin-bottom:14px;overflow:visible;}
.card-head{padding:10px 16px;font-size:13px;font-weight:700;color:#fff;border-radius:12px 12px 0 0;}
.card-body{padding:14px 16px 16px;}
.fg{margin-bottom:12px;position:relative;}
.fg label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;}
.fg input,.fg textarea{width:100%;padding:10px 12px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;background:#fafafa;color:#111;outline:none;font-family:inherit;}
.fg input:focus,.fg textarea:focus{border-color:#1a56db;background:#fff;}
.fg textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
.unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:#888;pointer-events:none;}
.sugg{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d0d0d0;border-radius:0 0 8px 8px;z-index:999;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.si{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.si:last-child{border-bottom:none;}
.si:hover,.si:active{background:#f0f5ff;}

/* Upload */
.upzone{border:2px dashed #ccc;border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:#fafafa;transition:.2s;text-align:center;}
.upzone:active{border-color:#25D366;background:#f0fff4;}
.upzone svg{opacity:.35;}
.upzone .ut{font-size:13px;color:#666;}
.upzone .uh{font-size:11px;color:#aaa;}
.prev-wrap{position:relative;width:100%;}
.prev-img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid #ddd;display:block;}
.rem-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fname{font-size:11px;color:#888;margin-top:5px;text-align:center;}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
.btn-share{background:#25D366;color:#fff;}
.btn-share:active{background:#1cb85a;}
.btn-clear{background:#fff;color:#888;border:1px solid #ccc;}
.btn-row{display:flex;gap:10px;margin-bottom:10px;}
.btn-row .btn{flex:1;}

/* Fallback */
.fb-wrap{display:none;background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:14px;margin-bottom:14px;}
.fb-title{font-size:12px;font-weight:700;color:#555;margin-bottom:10px;}
.fb-btns{display:flex;flex-wrap:wrap;gap:8px;}
.fb-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;}

/* Status */
.status{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:10px;display:none;}
.status.error{color:#c0392b;background:#fdecea;border:1px solid #f5c6c2;}
.status.success{color:#1a7a3a;background:#e6f9ed;border:1px solid #a8e6bc;}
.status.info{color:#1a56db;background:#e8f0fe;border:1px solid #c2d3fb;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h2>📋 New Order</h2>
    <p>Fill details · Upload image · Share on WhatsApp</p>
  </div>

  <!-- Order Details -->
  <div class="card">
    <div class="card-head" style="background:#1a56db;">Order Details</div>
    <div class="card-body">

      <div class="fg">
        <label>Company name</label>
        <input type="text" id="company" autocomplete="off"
          oninput="showAC('company')" onblur="hideAC('company')"/>
        <div id="company-sugg" class="sugg"></div>
      </div>

      <div class="fg">
        <label>Job name</label>
        <input type="text" id="job" autocomplete="off"
          oninput="showAC('job')" onblur="hideAC('job')"/>
        <div id="job-sugg" class="sugg"></div>
      </div>

      <div class="row2">
        <div class="fg">
          <label>Slitting size</label>
          <div style="position:relative;">
            <input type="number" id="slitting" style="padding-right:42px;"/>
            <span class="unit" style="top:50%;transform:translateY(-50%);">mm</span>
          </div>
        </div>
        <div class="fg">
          <label>Material size</label>
          <div style="position:relative;">
            <input type="number" id="matsize" style="padding-right:42px;"/>
            <span class="unit" style="top:50%;transform:translateY(-50%);">mm</span>
          </div>
        </div>
      </div>

      <div class="row2">
        <div class="fg">
          <label>Material</label>
          <input type="text" id="material" autocomplete="off"
            oninput="showMat()" onblur="hideMat()"/>
          <div id="material-sugg" class="sugg"></div>
        </div>
        <div class="fg">
          <label>Material micron</label>
          <input type="text" id="combin" autocomplete="off"
            oninput="filterMicron(this); showCom()" onblur="hideCom()"/>
          <div id="combin-sugg" class="sugg"></div>
        </div>
      </div>

      <div class="fg">
        <label>Order QTY</label>
        <div style="position:relative;">
          <input type="number" id="kg" style="padding-right:35px;"/>
          <span class="unit" style="top:50%;transform:translateY(-50%);">kg</span>
        </div>
      </div>

      <div class="fg">
        <label>Note</label>
        <textarea id="note"></textarea>
      </div>

    </div>
  </div>

  <!-- Image Upload -->
  <div class="card">
    <div class="card-head" style="background:#25D366;">Image (JPG)</div>
    <div class="card-body">
      <div class="upzone" id="upzone" onclick="document.getElementById('imgInput').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="ut">Tap to choose from Gallery</span>
        <span class="uh">JPG, PNG, WEBP · Max 10 MB</span>
        <div id="prevWrap" class="prev-wrap" style="display:none;" onclick="event.stopPropagation()">
          <img id="prevImg" class="prev-img" src="" alt=""/>
          <button class="rem-btn" onclick="clearImg(event)">✕</button>
        </div>
        <p id="fname" class="fname"></p>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none"/>
    </div>
  </div>

  <!-- Status -->
  <div id="status" class="status"></div>

  <!-- Share Buttons -->
  <div class="btn-row">
    <button class="btn btn-share" onclick="doShare()">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="white">
        <path d="M16 3C8.82 3 3 8.82 3 16c0 2.3.61 4.47 1.67 6.35L3 29l6.82-1.64A12.93 12.93 0 0016 29c7.18 0 13-5.82 13-13S23.18 3 16 3zm6.37 18.1c-.27.76-1.57 1.46-2.16 1.55-.56.09-1.26.13-2.03-.13-.47-.15-1.07-.36-1.84-.7-3.23-1.39-5.34-4.64-5.5-4.86-.16-.22-1.3-1.73-1.3-3.3 0-1.57.82-2.34 1.11-2.66.29-.32.63-.4.84-.4h.6c.19 0 .45-.07.7.54.27.63.91 2.22.99 2.38.08.16.13.35.03.56-.1.21-.16.34-.31.52-.16.18-.33.4-.47.54-.16.16-.33.33-.14.65.19.32.84 1.38 1.8 2.24 1.24 1.1 2.28 1.44 2.6 1.6.32.16.51.13.7-.08.19-.21.8-.93 1.01-1.25.21-.32.42-.27.7-.16.29.11 1.83.86 2.14 1.02.32.16.53.24.61.37.08.14.08.8-.19 1.57z"/>
      </svg>
      Share on WhatsApp
    </button>
    <button class="btn btn-clear" onclick="clearForm()">🗑</button>
  </div>

  <!-- Fallback buttons -->
  <div class="fb-wrap" id="fbWrap">
    <p class="fb-title">Choose app:</p>
    <div class="fb-btns">
      <button class="fb-btn" style="background:#25D366;" onclick="fbShare('wa')">
        WhatsApp
      </button>
      <button class="fb-btn" style="background:#128C7E;" onclick="fbShare('wab')">
        WA Business
      </button>
      <button class="fb-btn" style="background:#555;" onclick="fbCopy()">
        📋 Copy Text
      </button>
    </div>
  </div>

</div>

<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ── Image ──
let imgFile = null;
document.getElementById('imgInput').addEventListener('change', function(){
  const f = this.files[0];
  if(!f) return;
  if(f.size > 10*1024*1024){ showSt('File too large. Max 10 MB.','error'); return; }
  imgFile = f;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById('prevImg').src = e.target.result;
    document.getElementById('prevWrap').style.display = 'block';
    document.getElementById('fname').textContent = f.name + ' (' + (f.size/1024).toFixed(0) + ' KB)';
  };
  r.readAsDataURL(f);
});

function clearImg(e){
  e.stopPropagation();
  imgFile = null;
  document.getElementById('prevImg').src='';
  document.getElementById('prevWrap').style.display='none';
  document.getElementById('fname').textContent='';
  document.getElementById('imgInput').value='';
}

// ── Status ──
function showSt(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg; el.className='status '+type; el.style.display='block';
  if(type!=='info') setTimeout(()=>{ el.style.display='none'; }, 4000);
}

// ── Build text ──
let lastText = '';
function buildText(){
  const company = document.getElementById('company').value.trim();
  const job     = document.getElementById('job').value.trim();
  const sl      = document.getElementById('slitting').value.trim();
  const ms      = document.getElementById('matsize').value.trim();
  const mat     = document.getElementById('material').value.trim();
  const com     = document.getElementById('combin').value.trim();
  const kg      = document.getElementById('kg').value.trim();
  const note    = document.getElementById('note').value.trim();

  const miss = [];
  if(!company) miss.push('Company name');
  if(!job)     miss.push('Job name');
  if(!kg)      miss.push('Order QTY');
  if(miss.length){ showSt('Please fill: '+miss.join(', '),'error'); return null; }

  saveAll(company, job, mat, com);

  return (
    'New Order\n━━━━━━━━━━━━━━\n'+
    '➤ Company: '+company+'\n'+
    '➤ Job: '+job+'\n'+
    '➤ Slitting size: '+(sl?sl+' mm':'N/A')+'\n'+
    '➤ Material size: '+(ms?ms+' mm':'N/A')+'\n'+
    '➤ Material: '+(mat||'N/A')+'\n'+
    '➤ Material micron: '+(com||'N/A')+'\n'+
    '➤ Order QTY: '+kg+' kg\n'+
    '➤ Note: '+(note||'N/A')+'\n'+
    '━━━━━━━━━━━━━━'
  );
}

// ── Main Share ──
async function doShare(){
  const text = buildText();
  if(!text) return;
  lastText = text;

  // Try Web Share API with image
  if(navigator.share){
    try{
      if(imgFile && navigator.canShare){
        const sd = { files:[imgFile], title:'New Order', text:text };
        if(navigator.canShare(sd)){
          await navigator.share(sd);
          showSt('✓ Shared!','success');
          return;
        }
      }
      // Text only share
      await navigator.share({ text:text });
      showSt('✓ Shared!','success');
      return;
    } catch(e){
      if(e.name==='AbortError') return;
    }
  }

  // Fallback
  document.getElementById('fbWrap').style.display='block';
  document.getElementById('fbWrap').scrollIntoView({behavior:'smooth'});
}

function fbShare(app){
  const text = lastText || buildText();
  if(!text) return;
  const enc = encodeURIComponent(text);
  if(app==='wa'){
    const deep='whatsapp://send?text='+enc;
    const web='https://wa.me/?text='+enc;
    tryDeep(deep, web);
  } else if(app==='wab'){
    const deep='whatsapp-business://send?text='+enc;
    const web='https://wa.me/?text='+enc;
    tryDeep(deep, web);
  }
}

function tryDeep(deep, web){
  const el = document.createElement('iframe');
  el.style.display='none'; document.body.appendChild(el);
  el.src=deep;
  setTimeout(()=>{ document.body.removeChild(el); }, 1000);
  setTimeout(()=>{ if(!document.hidden) window.open(web,'_blank'); }, 1500);
}

async function fbCopy(){
  const text = lastText || buildText();
  if(!text) return;
  try{
    await navigator.clipboard.writeText(text);
    showSt('✓ Copied! Paste in WhatsApp.','success');
  } catch(e){ showSt('Copy failed.','error'); }
}

// ── Clear ──
function clearForm(){
  ['company','job','slitting','matsize','material','combin','kg','note']
    .forEach(id=>document.getElementById(id).value='');
  ['company','job','material','combin'].forEach(k=>{
    const b=document.getElementById(k+'-sugg'); if(b) b.style.display='none';
  });
  clearImg({stopPropagation:()=>{}});
  document.getElementById('status').style.display='none';
  document.getElementById('fbWrap').style.display='none';
  lastText='';
}

// ── Autocomplete (Company, Job) ──
function getList(k){ return JSON.parse(localStorage.getItem('ac_'+k)||'[]'); }
function saveList(k,v){
  if(!v) return;
  const l=getList(k);
  if(!l.includes(v)){ l.push(v); localStorage.setItem('ac_'+k,JSON.stringify(l)); }
}
function showAC(k){
  const v=document.getElementById(k).value.toLowerCase();
  const box=document.getElementById(k+'-sugg');
  const all=getList(k);
  const f=v?all.filter(i=>i.toLowerCase().includes(v)):all;
  if(!f.length){ box.style.display='none'; return; }
  box.innerHTML=f.map(i=>`<div class="si" onmousedown="pickAC('${k}','${i.replace(/'/g,"\\'")}')">
    ${v?i.replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<b style="color:#1a56db;">$1</b>'):i}
  </div>`).join('');
  box.style.display='block';
}
function pickAC(k,v){ document.getElementById(k).value=v; document.getElementById(k+'-sugg').style.display='none'; }
function hideAC(k){
  setTimeout(()=>{
    saveList(k, document.getElementById(k).value.trim());
    document.getElementById(k+'-sugg').style.display='none';
  },150);
}

// ── Material ──
const DM=['PET + PET + LD','PET + MPET + LD','PET + LD','MET BOPP + MPET + LD','MET BOPP + PEARL BOPP','MPET + LD','PET + MILKI LD','CLEAR BOPP'];
function getMats(){ return [...new Set([...DM,...JSON.parse(localStorage.getItem('mats')||'[]')])]; }
function saveMat(v){
  if(!v||DM.includes(v)) return;
  const l=JSON.parse(localStorage.getItem('mats')||'[]');
  if(!l.includes(v)){ l.push(v); localStorage.setItem('mats',JSON.stringify(l)); }
}
function showMat(){
  const v=document.getElementById('material').value.toLowerCase();
  const box=document.getElementById('material-sugg');
  const f=v?getMats().filter(m=>m.toLowerCase().includes(v)):getMats();
  if(!f.length){ box.style.display='none'; return; }
  box.innerHTML=f.map(m=>`<div class="si" onmousedown="pickMat('${m.replace(/'/g,"\\'")}')">
    ${v?m.replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<b style="color:#1a56db;">$1</b>'):m}
  </div>`).join('');
  box.style.display='block';
}
function pickMat(v){ document.getElementById('material').value=v; document.getElementById('material-sugg').style.display='none'; }
function hideMat(){
  setTimeout(()=>{
    saveMat(document.getElementById('material').value.trim());
    document.getElementById('material-sugg').style.display='none';
  },150);
}

// ── Material micron — only numbers and + ──
function filterMicron(el){
  const pos = el.selectionStart;
  const clean = el.value.replace(/[^0-9+]/g, '');
  if(el.value !== clean){
    el.value = clean;
    try{ el.setSelectionRange(pos-1, pos-1); }catch(e){}
  }
}

// ── Combin ──
const DC=['12+12+25','10+10+25','12+25','8+8+20','12+50'];
function getComs(){ return [...new Set([...DC,...JSON.parse(localStorage.getItem('coms')||'[]')])]; }
function saveCom(v){
  if(!v||DC.includes(v)) return;
  const l=JSON.parse(localStorage.getItem('coms')||'[]');
  if(!l.includes(v)){ l.push(v); localStorage.setItem('coms',JSON.stringify(l)); }
}
function showCom(){
  const v=document.getElementById('combin').value.toLowerCase();
  const box=document.getElementById('combin-sugg');
  const f=v?getComs().filter(c=>c.toLowerCase().includes(v)):getComs();
  if(!f.length){ box.style.display='none'; return; }
  box.innerHTML=f.map(c=>`<div class="si" onmousedown="pickCom('${c.replace(/'/g,"\\'")}')">
    ${v?c.replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<b style="color:#1a56db;">$1</b>'):c}
  </div>`).join('');
  box.style.display='block';
}
function pickCom(v){ document.getElementById('combin').value=v; document.getElementById('combin-sugg').style.display='none'; }
function hideCom(){
  setTimeout(()=>{
    saveCom(document.getElementById('combin').value.trim());
    document.getElementById('combin-sugg').style.display='none';
  },150);
}

// ── Save all on share ──
function saveAll(company,job,mat,com){
  saveList('company',company);
  saveList('job',job);
  saveMat(mat);
  saveCom(com);
}
</script>
</body>
</html>
