<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Form</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#111;min-height:100vh;}
  .wrap{padding:16px;max-width:600px;margin:auto;}
  .page-header{padding:16px;color:#fff;text-align:center;background:#1a56db;border-radius:12px;margin-bottom:14px;}
  .page-header h2{font-size:18px;font-weight:700;}
  .page-header p{font-size:12px;opacity:.8;margin-top:3px;}
  .card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;margin-bottom:14px;overflow:hidden;}
  .card-header{padding:10px 16px;font-size:13px;font-weight:700;color:#fff;background:#1a56db;}
  .card-body{padding:12px 16px 16px;}
  .form-group{margin-bottom:12px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;}
  .form-group input,.form-group textarea{width:100%;padding:9px 11px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;background:#fafafa;color:#111;outline:none;font-family:inherit;}
  .form-group input:focus,.form-group textarea:focus{border-color:#1a56db;background:#fff;}
  .form-group textarea{resize:vertical;min-height:72px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .upload-zone{border:1.5px dashed #bbb;border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:#fafafa;transition:.2s;min-height:90px;justify-content:center;}
  .upload-zone:hover{border-color:#1a56db;}
  .upload-zone svg{opacity:.4;}
  .uz-text{font-size:13px;color:#666;text-align:center;}
  .uz-hint{font-size:11px;color:#aaa;}
  .preview-wrap{position:relative;width:100%;}
  .preview-img{max-width:100%;max-height:150px;border-radius:8px;border:1px solid #ddd;display:block;}
  .remove-img{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#333;color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .file-label{font-size:11px;color:#888;margin-top:4px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;width:100%;}
  .btn-wa{background:#25D366;color:#fff;}
  .btn-wa:hover{background:#1cb85a;}
  .btn-clear{background:#fff;color:#888;border:1px solid #ccc;}
  .btn-row{display:flex;gap:10px;margin-bottom:20px;}
  .btn-row .btn{flex:1;}
  .status{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:8px;display:none;}
  .status.error{color:#c0392b;background:#fdecea;border:1px solid #f5c6c2;}
  .status.success{color:#1a7a3a;background:#e6f9ed;border:1px solid #a8e6bc;}
  .status.info{color:#1a56db;background:#e8f0fe;border:1px solid #c2d3fb;}
</style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <h2>📋 New Order</h2>
    <p>Fill in the details and share on WhatsApp</p>
  </div>

  <!-- Order Fields -->
  <div class="card">
    <div class="card-header">Order Details</div>
    <div class="card-body">
      <div class="form-group">
        <label>Company name</label>
        <input type="text" id="company"/>
      </div>
      <div class="form-group">
        <label>Job name</label>
        <input type="text" id="job"/>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Slitting size</label>
          <input type="text" id="slitting"/>
        </div>
        <div class="form-group">
          <label>Material size</label>
          <input type="text" id="matsize"/>
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>Material</label>
          <input type="text" id="material"/>
        </div>
        <div class="form-group">
          <label>Material Combin</label>
          <input type="text" id="combin"/>
        </div>
      </div>
      <div class="form-group">
        <label>Order in kg</label>
        <input type="number" id="kg" min="0"/>
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="note"></textarea>
      </div>
    </div>
  </div>

  <!-- WhatsApp Image -->
  <div class="card">
    <div class="card-header" style="background:#25D366;">Image for WhatsApp (JPG)</div>
    <div class="card-body">
      <div class="upload-zone" onclick="document.getElementById('wa-img-input').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="uz-text">Tap to choose from Gallery</span>
        <span class="uz-hint">JPG only · Max 5 MB</span>
        <div id="wa-preview-wrap" class="preview-wrap" style="display:none;" onclick="event.stopPropagation()">
          <img id="wa-preview" class="preview-img" src="" alt=""/>
          <button class="remove-img" onclick="clearWaImg(event)">✕</button>
        </div>
        <p id="wa-img-label" class="file-label"></p>
      </div>
      <input type="file" id="wa-img-input" accept="image/jpeg,image/jpg" style="display:none"/>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-wa" onclick="shareWA()">
      <svg width="18" height="18" viewBox="0 0 32 32" fill="white">
        <path d="M16 3C8.82 3 3 8.82 3 16c0 2.3.61 4.47 1.67 6.35L3 29l6.82-1.64A12.93 12.93 0 0016 29c7.18 0 13-5.82 13-13S23.18 3 16 3zm6.37 18.1c-.27.76-1.57 1.46-2.16 1.55-.56.09-1.26.13-2.03-.13-.47-.15-1.07-.36-1.84-.7-3.23-1.39-5.34-4.64-5.5-4.86-.16-.22-1.3-1.73-1.3-3.3 0-1.57.82-2.34 1.11-2.66.29-.32.63-.4.84-.4h.6c.19 0 .45-.07.7.54.27.63.91 2.22.99 2.38.08.16.13.35.03.56-.1.21-.16.34-.31.52-.16.18-.33.4-.47.54-.16.16-.33.33-.14.65.19.32.84 1.38 1.8 2.24 1.24 1.1 2.28 1.44 2.6 1.6.32.16.51.13.7-.08.19-.21.8-.93 1.01-1.25.21-.32.42-.27.7-.16.29.11 1.83.86 2.14 1.02.32.16.53.24.61.37.08.14.08.8-.19 1.57z"/>
      </svg>
      Share on WhatsApp
    </button>
    <button class="btn btn-clear" onclick="clearForm()">Clear</button>
  </div>
  <div id="wa-status" class="status"></div>

</div>
<script>
  let waFile = null;

  document.getElementById('wa-img-input').addEventListener('change', function() {
    if (this.files[0]) loadWaImg(this.files[0]);
  });

  function loadWaImg(file) {
    if (file.size > 5 * 1024 * 1024) { showStatus('wa-status','File too large. Max 5 MB.','error'); return; }
    waFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('wa-preview').src = e.target.result;
      document.getElementById('wa-preview-wrap').style.display = 'block';
      document.getElementById('wa-img-label').textContent = file.name;
    };
    reader.readAsDataURL(file);
  }

  function clearWaImg(e) {
    e.stopPropagation();
    waFile = null;
    document.getElementById('wa-preview').src = '';
    document.getElementById('wa-preview-wrap').style.display = 'none';
    document.getElementById('wa-img-label').textContent = '';
    document.getElementById('wa-img-input').value = '';
  }

  function showStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status ' + type;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  async function shareWA() {
    const company  = document.getElementById('company').value.trim();
    const job      = document.getElementById('job').value.trim();
    const slitting = document.getElementById('slitting').value.trim();
    const matsize  = document.getElementById('matsize').value.trim();
    const material = document.getElementById('material').value.trim();
    const combin   = document.getElementById('combin').value.trim();
    const kg       = document.getElementById('kg').value.trim();
    const note     = document.getElementById('note').value.trim();

    const missing = [];
    if (!company) missing.push('Company name');
    if (!job)     missing.push('Job name');
    if (!kg)      missing.push('Order in kg');
    if (missing.length) {
      showStatus('wa-status', 'Please fill in: ' + missing.join(', '), 'error');
      return;
    }

    const text =
      'New Order\n' +
      '━━━━━━━━━━━━━━\n' +
      '➤ Company: ' + company + '\n' +
      '➤ Job: ' + job + '\n' +
      '➤ Slitting size: ' + (slitting||'N/A') + '\n' +
      '➤ Material size: ' + (matsize||'N/A') + '\n' +
      '➤ Material: ' + (material||'N/A') + '\n' +
      '➤ Material Combin: ' + (combin||'N/A') + '\n' +
      '➤ Order (kg): ' + kg + ' kg\n' +
      '➤ Note: ' + (note||'N/A') + '\n' +
      '━━━━━━━━━━━━━━';

    if (waFile && navigator.canShare) {
      try {
        const sd = { text, files: [waFile] };
        if (navigator.canShare(sd)) {
          await navigator.share(sd);
          showStatus('wa-status', '✓ Shared!', 'success');
          return;
        }
      } catch(e) {
        if (e.name === 'AbortError') return;
      }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    showStatus('wa-status', '✓ WhatsApp opened!', 'success');
  }

  function clearForm() {
    ['company','job','slitting','matsize','material','combin','kg','note']
      .forEach(id => document.getElementById(id).value = '');
    clearWaImg({ stopPropagation: () => {} });
    document.getElementById('wa-status').style.display = 'none';
  }
</script>
</body>
</html>
